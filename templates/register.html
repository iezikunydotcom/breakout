{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
  <div class="card">
    <h1>🧱 Rainbow Blocks</h1>
    <p class="sub">Create your account and start playing</p>
    <form method="post">
      <label>Your name
        <input name="name" maxlength="30" required />
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <label>Password (at least 6 characters)
        <input type="password" name="password" autocomplete="new-password" minlength="6" required />
      </label>
      <label>Confirm password
        <input type="password" name="confirm" autocomplete="new-password" minlength="6" required />
      </label>
      <button class="btn" type="submit">Create Account</button>
    </form>
    <p class="alt">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
{% endblock %}
