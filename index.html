<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>" />
  <title>Rainbow Blocks</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(20, 29, 48, 0.82);
      --border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #4ade80;
      --accent-2: #a78bfa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1000px 600px at 15% -10%, rgba(167, 139, 250, 0.16), transparent 60%),
        radial-gradient(900px 600px at 110% 110%, rgba(74, 222, 128, 0.12), transparent 60%),
        radial-gradient(700px 500px at 85% -5%, rgba(56, 189, 248, 0.1), transparent 55%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .shell {
      width: 100%;
      max-width: 520px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.9rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .brand .grad,
    .overlay h2.grad {
      background: linear-gradient(90deg, #f87171, #fbbf24, #4ade80, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .pills {
      display: flex;
      gap: 0.45rem;
    }

    .pill {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 0.4rem 0.7rem;
      min-width: 62px;
    }

    .pill .label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .pill strong {
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .stage {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 0.85rem;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .board-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #070b16;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.08), 0 0 34px rgba(74, 222, 128, 0.06);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 11, 22, 0.78);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.22s ease-out;
      padding: 1.25rem;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-inner {
      text-align: center;
      max-width: 34ch;
      animation: riseIn 0.28s ease-out;
    }

    .overlay .eyebrow {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--muted);
      margin-bottom: 0.45rem;
      font-weight: 700;
    }

    .overlay h2 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 0.55rem;
    }

    .overlay p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .badge-new {
      display: none;
      margin: 0 auto 0.7rem;
      width: fit-content;
      background: linear-gradient(90deg, #fbbf24, #f87171);
      color: #1f1205;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.35);
    }

    .badge-new.show {
      display: block;
      animation: pop 0.3s ease-out;
    }

    .btn {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      font-family: inherit;
      transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      color: #052016;
      font-size: 1.02rem;
      padding: 0.8rem 2rem;
      box-shadow: 0 8px 26px rgba(74, 222, 128, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(74, 222, 128, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
    }

    .btn-ghost:hover {
      color: var(--text);
      background: rgba(148, 163, 184, 0.1);
    }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.85rem;
      flex-wrap: wrap;
    }

    .hint {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.7;
    }

    .kbd {
      display: inline-block;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 0.05rem 0.45rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }

    .popup {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: 1rem;
      color: #f8fafc;
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 3;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%); }
      100% { opacity: 0; transform: translate(-50%, -180%); }
    }

    @media (max-width: 430px) {
      .top { justify-content: center; }
      .brand { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <h1 class="brand"><span class="grad">Rainbow Blocks</span></h1>
      <div class="pills">
        <div class="pill"><span class="label">Score</span><strong id="score">0</strong></div>
        <div class="pill"><span class="label">Best</span><strong id="best">0</strong></div>
        <div class="pill"><span class="label">Lives</span><strong id="lives">3</strong></div>
      </div>
    </header>

    <section class="stage">
      <div id="board-wrap" class="board-wrap">
        <canvas id="board" width="480" height="640"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-inner">
            <div id="eyebrow" class="eyebrow">Arcade Classic</div>
            <h2 id="overlay-title" class="grad">Rainbow Blocks</h2>
            <p id="overlay-message">Guide the ball and smash every rainbow brick. You have three lives - don't let the ball drop!</p>
            <div id="new-badge" class="badge-new">New Best!</div>
            <button id="start-btn" class="btn btn-primary">Start Game</button>
          </div>
        </div>
      </div>

      <div class="foot">
        <p class="hint">
          <span class="kbd">Mouse</span> or <span class="kbd">←</span> <span class="kbd">→</span> to move<br />
          <span class="kbd">P</span> pause &middot; <span class="kbd">R</span> restart
        </p>
        <button id="pause-btn" class="btn btn-ghost" disabled>Pause</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const boardWrap = document.getElementById("board-wrap");
      const W = canvas.width;
      const H = canvas.height;

      const overlay = document.getElementById("overlay");
      const eyebrowEl = document.getElementById("eyebrow");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMessage = document.getElementById("overlay-message");
      const newBadge = document.getElementById("new-badge");
      const startBtn = document.getElementById("start-btn");
      const pauseBtn = document.getElementById("pause-btn");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const livesEl = document.getElementById("lives");

      const PADDLE_W = 90;
      const PADDLE_H = 12;
      const PADDLE_Y = H - 30;
      const BALL_R = 6;
      const BALL_SPEED = 3.4;
      const ROWS = 5;
      const COLS = 8;
      const BRICK_W = 54;
      const BRICK_H = 20;
      const BRICK_GAP = 4;
      const BRICK_TOP = 60;
      const BRICK_LEFT = 8;
      const MAX_LIVES = 3;

      let bricks = [];
      let ball = null;
      let ballDx = BALL_SPEED;
      let ballDy = -BALL_SPEED;
      let paddleX = W / 2 - PADDLE_W / 2;
      let score = 0;
      let lives = MAX_LIVES;
      let best = Number(localStorage.getItem("rainbow-blocks-best") || 0);
      let state = "start"; // start | running | paused | over | won
      let newBestThisRun = false;
      let rafId = null;

      bestEl.textContent = best;

      function buildBricks() {
        bricks = [];
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const hue = ((row * COLS + col) * 360) / (ROWS * COLS);
            bricks.push({
              x: BRICK_LEFT + col * (BRICK_W + BRICK_GAP),
              y: BRICK_TOP + row * (BRICK_H + BRICK_GAP),
              w: BRICK_W,
              h: BRICK_H,
              hue,
            });
          }
        }
      }

      function resetBall() {
        ball = { x: paddleX + PADDLE_W / 2, y: PADDLE_Y - BALL_R };
        ballDx = BALL_SPEED * (Math.random() < 0.5 ? -1 : 1);
        ballDy = -BALL_SPEED;
      }

      function showOverlay(eyebrow, title, message, button, showBadge) {
        eyebrowEl.textContent = eyebrow;
        overlayTitle.textContent = title;
        overlayMessage.textContent = message;
        startBtn.textContent = button;
        newBadge.classList.toggle("show", Boolean(showBadge));
        overlay.classList.remove("hidden");
      }

      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function renderOverlay() {
        if (state === "start") {
          showOverlay(
            "Arcade Classic",
            "Rainbow Blocks",
            "Guide the ball and smash every rainbow brick. You have three lives - don't let the ball drop!",
            "Start Game",
            false
          );
        } else if (state === "paused") {
          showOverlay("Take a breath", "Paused", "Press Resume or P to keep playing.", "Resume", false);
        } else if (state === "over") {
          showOverlay(
            "Nice try",
            "Game Over",
            "You scored " + score + " points. Don't let the ball fall!",
            "Play Again",
            newBestThisRun
          );
        } else if (state === "won") {
          showOverlay(
            "Incredible",
            "You Win!",
            "You cleared every brick with " + score + " points!",
            "Play Again",
            newBestThisRun
          );
        }
      }

      function newGame() {
        score = 0;
        lives = MAX_LIVES;
        newBestThisRun = false;
        paddleX = W / 2 - PADDLE_W / 2;
        scoreEl.textContent = "0";
        livesEl.textContent = lives;
        buildBricks();
        resetBall();
      }

      function startGame() {
        newGame();
        state = "running";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "Pause";
        hideOverlay();
        if (!rafId) rafId = requestAnimationFrame(loop);
      }

      function setPaused(paused) {
        state = paused ? "paused" : "running";
        pauseBtn.textContent = paused ? "Resume" : "Pause";
        if (paused) {
          renderOverlay();
        } else {
          hideOverlay();
        }
        draw();
      }

      function togglePause() {
        if (state === "running") setPaused(true);
        else if (state === "paused") setPaused(false);
      }

      function endGame(won) {
        state = won ? "won" : "over";
        pauseBtn.disabled = true;
        saveBest();
        renderOverlay();
        draw();
      }

      function saveBest() {
        if (score > best) {
          best = score;
          newBestThisRun = true;
          bestEl.textContent = best;
          localStorage.setItem("rainbow-blocks-best", String(best));
        }
      }

      function spawnPopup(px, py, text) {
        const scale = boardWrap.clientWidth / W;
        const el = document.createElement("span");
        el.className = "popup";
        el.textContent = text;
        el.style.left = px * scale + "px";
        el.style.top = py * scale + "px";
        boardWrap.appendChild(el);
        setTimeout(() => el.remove(), 850);
      }

      function update() {
        ball.x += ballDx;
        ball.y += ballDy;

        if (ball.x - BALL_R <= 0 || ball.x + BALL_R >= W) ballDx = -ballDx;
        if (ball.y - BALL_R <= 0) ballDy = -ballDy;

        if (
          ballDy > 0 &&
          ball.y + BALL_R >= PADDLE_Y &&
          ball.y + BALL_R <= PADDLE_Y + PADDLE_H + 4 &&
          ball.x >= paddleX &&
          ball.x <= paddleX + PADDLE_W
        ) {
          const offset = (ball.x - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2);
          ballDx = offset * BALL_SPEED * 1.4;
          ballDy = -Math.abs(ballDy);
        }

        for (let i = bricks.length - 1; i >= 0; i--) {
          const b = bricks[i];
          if (
            ball.x + BALL_R >= b.x && ball.x - BALL_R <= b.x + b.w &&
            ball.y + BALL_R >= b.y && ball.y - BALL_R <= b.y + b.h
          ) {
            bricks.splice(i, 1);
            ballDy = -ballDy;
            score += 10;
            scoreEl.textContent = score;
            spawnPopup(b.x + b.w / 2, b.y + b.h / 2, "+10");
          }
        }

        if (ball.y - BALL_R > H) {
          lives--;
          livesEl.textContent = lives;
          if (lives <= 0) {
            endGame(false);
          } else {
            resetBall();
          }
        } else if (bricks.length === 0) {
          endGame(true);
        }
      }

      function loop() {
        if (state === "running") update();
        draw();
        if (state !== "start" && state !== "over" && state !== "won") {
          rafId = requestAnimationFrame(loop);
        } else {
          rafId = null;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (let y = 0; y < H; y += 16) {
          for (let x = 0; x < W; x += 16) {
            ctx.fillStyle = (x / 16 + y / 16) % 2 === 0 ? "#0d1424" : "#0a101d";
            ctx.fillRect(x, y, 16, 16);
          }
        }

        bricks.forEach((b) => {
          ctx.fillStyle = "hsl(" + Math.round(b.hue) + ", 85%, 56%)";
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 6);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.18)";
          ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 4);
        });

        ctx.save();
        ctx.shadowColor = "rgba(148, 163, 184, 0.75)";
        ctx.shadowBlur = 14;
        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 7);
        ctx.fill();
        ctx.restore();

        if (ball) {
          ctx.save();
          ctx.shadowColor = "rgba(248, 250, 252, 0.9)";
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
          ctx.fillStyle = "#f8fafc";
          ctx.fill();
          ctx.restore();
        }
      }

      function movePaddle(x) {
        paddleX = Math.max(0, Math.min(W - PADDLE_W, x - PADDLE_W / 2));
      }

      document.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (key === "p") {
          e.preventDefault();
          togglePause();
          return;
        }
        if (key === "r") {
          e.preventDefault();
          startGame();
          return;
        }
        if (key === "arrowleft" || key === "a") {
          e.preventDefault();
          if (state === "start" || state === "over" || state === "won") startGame();
          paddleX = Math.max(0, paddleX - 14);
          return;
        }
        if (key === "arrowright" || key === "d") {
          e.preventDefault();
          if (state === "start" || state === "over" || state === "won") startGame();
          paddleX = Math.min(W - PADDLE_W, paddleX + 14);
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        movePaddle(((e.clientX - rect.left) / rect.width) * W);
      });
      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        movePaddle(((e.touches[0].clientX - rect.left) / rect.width) * W);
      }, { passive: false });

      startBtn.addEventListener("click", () => {
        if (state === "paused") setPaused(false);
        else startGame();
      });
      pauseBtn.addEventListener("click", togglePause);

      renderOverlay();
      newGame();
      draw();
    })();
  </script>
</body>
</html>
