<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0e1f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>" />
  <title>Rainbow Tower</title>
  <style>
    :root {
      --bg: #0b0e1f;
      --panel: rgba(20, 27, 50, 0.76);
      --border: rgba(148, 163, 184, 0.16);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      overflow-x: hidden;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.38;
      pointer-events: none;
      z-index: 0;
    }

    .blob.b1 { width: 46vw; height: 46vw; left: -14vw; top: -12vw; background: #7c3aed; animation: drift1 16s ease-in-out infinite alternate; }
    .blob.b2 { width: 42vw; height: 42vw; right: -13vw; bottom: -15vw; background: #0891b2; animation: drift2 19s ease-in-out infinite alternate; }
    .blob.b3 { width: 26vw; height: 26vw; right: 18vw; top: -8vw; background: #db2777; opacity: 0.26; animation: drift3 13s ease-in-out infinite alternate; }

    @keyframes drift1 {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(9vw, 7vh) scale(1.18); }
    }
    @keyframes drift2 {
      from { transform: translate(0, 0) scale(1.1); }
      to { transform: translate(-8vw, -6vh) scale(0.95); }
    }
    @keyframes drift3 {
      from { transform: translate(0, 0) scale(0.9); }
      to { transform: translate(5vw, 8vh) scale(1.25); }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.9rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.32rem;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    .grad {
      background: linear-gradient(90deg, #f87171, #fbbf24, #4ade80, #38bdf8, #a78bfa, #f87171);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 5s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 220% center; }
    }

    .pills {
      display: flex;
      gap: 0.4rem;
    }

    .pill {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 0.38rem 0.6rem;
      min-width: 56px;
    }

    .pill .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .pill strong {
      font-size: 1.02rem;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 0.85rem;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .board-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #070a18;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.08);
      will-change: transform;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      touch-action: none;
    }

    #banner {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: 1.02rem;
      letter-spacing: 0.04em;
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      z-index: 5;
      white-space: nowrap;
    }

    #banner.show { opacity: 1; animation: bannerPop 0.3s ease-out; }
    #banner.good { background: rgba(74, 222, 128, 0.18); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.45); }
    #banner.bad { background: rgba(248, 113, 113, 0.2); color: #fda4af; border: 1px solid rgba(248, 113, 113, 0.5); }
    #banner.warn { background: rgba(251, 191, 36, 0.18); color: #fde68a; border: 1px solid rgba(251, 191, 36, 0.45); }

    @keyframes bannerPop {
      0% { transform: translateX(-50%) scale(0.7); }
      60% { transform: translateX(-50%) scale(1.08); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 8, 18, 0.82);
      backdrop-filter: blur(5px);
      animation: fadeIn 0.22s ease-out;
      padding: 1.25rem;
      z-index: 6;
    }

    .overlay.hidden { display: none; }

    .overlay-inner {
      text-align: center;
      max-width: 36ch;
      animation: riseIn 0.28s ease-out;
    }

    .overlay .eyebrow {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: var(--muted);
      margin-bottom: 0.45rem;
      font-weight: 700;
    }

    .overlay h2 {
      font-size: 1.85rem;
      font-weight: 900;
      margin-bottom: 0.55rem;
    }

    .overlay p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }

    .badge-new {
      display: none;
      margin: 0 auto 0.7rem;
      width: fit-content;
      background: linear-gradient(90deg, #fbbf24, #f87171);
      color: #1f1205;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.35);
    }

    .badge-new.show { display: block; animation: pop 0.3s ease-out; }

    .btn {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      font-family: inherit;
      transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      color: #052016;
      font-size: 1.02rem;
      padding: 0.8rem 2rem;
      box-shadow: 0 8px 26px rgba(74, 222, 128, 0.28);
      animation: ctaPulse 2.2s ease-in-out infinite;
    }

    @keyframes ctaPulse {
      0%, 100% { box-shadow: 0 8px 26px rgba(74, 222, 128, 0.25); }
      50% { box-shadow: 0 8px 38px rgba(74, 222, 128, 0.55); }
    }

    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:active { transform: scale(0.96); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      font-size: 0.9rem;
    }

    .btn-ghost:hover { color: var(--text); background: rgba(148, 163, 184, 0.1); }

    .status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.6rem;
      min-height: 30px;
      margin-top: 0.7rem;
    }

    .combo {
      font-weight: 900;
      font-size: 0.92rem;
      padding: 0.18rem 0.75rem;
      border-radius: 999px;
      color: #1f1205;
      background: linear-gradient(90deg, #fbbf24, #f87171);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.4);
    }

    .combo.hidden { display: none; }
    .combo.bump { animation: pop 0.28s ease-out; }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .foot-btns { display: flex; gap: 0.5rem; align-items: center; }

    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .kbd {
      display: inline-block;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 0.02rem 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }

    .popup {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 900;
      font-size: 1.05rem;
      color: #fff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.7);
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
      z-index: 3;
      white-space: nowrap;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%); }
      100% { opacity: 0; transform: translate(-50%, -240%); }
    }

    @media (max-width: 440px) {
      .top { justify-content: center; }
      .brand { width: 100%; text-align: center; }
      .foot { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="shell">
    <header class="top">
      <h1 class="brand"><span class="grad">Rainbow Tower</span></h1>
      <div class="pills">
        <div class="pill"><span class="label">Height</span><strong id="score">0</strong></div>
        <div class="pill"><span class="label">Perfect</span><strong id="perfect">0</strong></div>
        <div class="pill"><span class="label">Best</span><strong id="best">0</strong></div>
      </div>
    </header>

    <section class="stage">
      <div id="board-wrap" class="board-wrap">
        <canvas id="board" width="480" height="640"></canvas>
        <div id="banner"></div>
        <div id="overlay" class="overlay">
          <div class="overlay-inner">
            <div id="eyebrow" class="eyebrow">Slice &amp; Stack</div>
            <h2 id="overlay-title" class="grad">Rainbow Tower</h2>
            <p id="overlay-message">Time your drop so each block lands perfectly on the tower. Overhang gets sliced away - slice it perfectly to keep the full block!</p>
            <div id="new-badge" class="badge-new">New Best!</div>
            <button id="start-btn" class="btn btn-primary">Start Building</button>
          </div>
        </div>
      </div>

      <div class="status">
        <span id="combo" class="combo hidden">PERFECT x2</span>
      </div>

      <div class="foot">
        <p class="hint">
          <span class="kbd">Click</span> / <span class="kbd">Space</span> to drop<br />
          <span class="kbd">P</span> pause &middot; <span class="kbd">R</span> restart &middot; <span class="kbd">M</span> sound
        </p>
        <div class="foot-btns">
          <button id="mute-btn" class="btn btn-ghost" aria-label="Toggle sound">🔊</button>
          <button id="pause-btn" class="btn btn-ghost" disabled>Pause</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const boardWrap = document.getElementById("board-wrap");
      const W = canvas.width;
      const H = canvas.height;

      const overlay = document.getElementById("overlay");
      const eyebrowEl = document.getElementById("eyebrow");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMessage = document.getElementById("overlay-message");
      const newBadge = document.getElementById("new-badge");
      const banner = document.getElementById("banner");
      const startBtn = document.getElementById("start-btn");
      const pauseBtn = document.getElementById("pause-btn");
      const muteBtn = document.getElementById("mute-btn");
      const scoreEl = document.getElementById("score");
      const perfectEl = document.getElementById("perfect");
      const bestEl = document.getElementById("best");
      const comboEl = document.getElementById("combo");

      const BLOCK_H = 24;
      const BASE_W = 250;
      const BASE_Y = 560;
      const MIN_W = 14;
      const PERFECT_TOLERANCE = 1.4;

      let stack = [];
      let moving = null;
      let dir = 1;
      let dropY = BASE_Y;
      let score = 0;
      let perfectStreak = 0;
      let best = Number(localStorage.getItem("rainbow-tower-best") || 0);
      let state = "start";
      let newBestThisRun = false;
      let rafId = null;
      let bannerTimer = 0;
      let flashTimer = 0;
      let debris = [];
      let particles = [];
      let rings = [];

      let audioCtx = null;
      let noiseBuf = null;
      let muted = false;

      const cutSound = new Audio("sounds/cut.mp3");
      const perfectSound = new Audio("sounds/perfect.mp3");

      function playSample(snd) {
        if (muted) return;
        try {
          snd.volume = 1;
          snd.currentTime = 0;
          const p = snd.play();
          if (p && p.catch) p.catch(() => {});
        } catch (e) {
          // sound file missing or blocked - stay quiet
        }
      }

      // ---------- audio: slice ASMR ----------
      function ensureAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            audioCtx = null;
          }
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        if (audioCtx && !noiseBuf) {
          const len = audioCtx.sampleRate * 1;
          noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const data = noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
      }

      function tone(freq, duration, type, volume, delay, slideTo) {
        if (muted || !audioCtx) return;
        try {
          const t = audioCtx.currentTime + (delay || 0);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(freq, t);
          if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + (duration || 0.1));
          gain.gain.setValueAtTime(volume || 0.05, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + (duration || 0.1));
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + (duration || 0.1) + 0.03);
        } catch (e) {
          // ignore
        }
      }

      function foamCut(intensity, dur, delay) {
        if (muted || !audioCtx || !noiseBuf) return;
        try {
          const t = audioCtx.currentTime + (delay || 0);
          const length = dur || 0.3;

          // Main bright shear - the "cutting foam" body.
          const src = audioCtx.createBufferSource();
          src.buffer = noiseBuf;
          const filter = audioCtx.createBiquadFilter();
          filter.type = "bandpass";
          filter.Q.value = 0.85;
          filter.frequency.setValueAtTime(800, t);
          filter.frequency.exponentialRampToValueAtTime(5600, t + length * 0.75);
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(intensity || 0.35, t + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + length);
          src.connect(filter).connect(gain).connect(audioCtx.destination);
          src.start(t);
          src.stop(t + length + 0.05);

          // Crisp high snap tail - the foam "crinkle".
          const snap = audioCtx.createBufferSource();
          snap.buffer = noiseBuf;
          const hp = audioCtx.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 2800;
          const snapGain = audioCtx.createGain();
          const peak = (intensity || 0.35) * 0.55;
          snapGain.gain.setValueAtTime(0.0001, t + 0.018);
          snapGain.gain.exponentialRampToValueAtTime(peak, t + 0.045);
          snapGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
          snap.connect(hp).connect(snapGain).connect(audioCtx.destination);
          snap.start(t + 0.018);
          snap.stop(t + 0.18);
        } catch (e) {
          // ignore
        }
      }

      function sliceSound(perfect) {
        playSample(perfect ? perfectSound : cutSound);
      }

      // ---------- helpers ----------
      function colorFor(i) {
        return (i * 13) % 360;
      }

      function currentSpeed() {
        return Math.min(7.2, 1.7 + score * 0.1);
      }

      function topBlock() {
        return stack[stack.length - 1];
      }

      function showBanner(text, kind, frames) {
        banner.textContent = text;
        banner.className = kind;
        void banner.offsetWidth;
        banner.classList.add("show");
        bannerTimer = frames || 110;
      }

      function spawnPopup(px, py, text, color) {
        const scale = boardWrap.clientWidth / W;
        const el = document.createElement("span");
        el.className = "popup";
        el.textContent = text;
        if (color) el.style.color = color;
        el.style.left = px * scale + "px";
        el.style.top = py * scale + "px";
        boardWrap.appendChild(el);
        setTimeout(() => el.remove(), 950);
      }

      function burst(x, y, hues, count, speed) {
        for (let i = 0; i < (count || 16); i++) {
          const angle = Math.random() * Math.PI * 2;
          const sp = (speed || 1.2) + Math.random() * 3.6;
          particles.push({
            x, y,
            vx: Math.cos(angle) * sp,
            vy: Math.sin(angle) * sp,
            life: 1,
            size: 3 + Math.random() * 3,
            hue: hues[Math.floor(Math.random() * hues.length)],
          });
        }
      }

      function ring(x, y, hue) {
        rings.push({ x, y, r: 5, life: 1, hue: hue || 190 });
      }

      // ---------- game flow ----------
      function newGame() {
        stack = [];
        score = 0;
        perfectStreak = 0;
        newBestThisRun = false;
        debris = [];
        particles = [];
        rings = [];
        flashTimer = 0;
        banner.className = "";
        comboEl.classList.add("hidden");
        scoreEl.textContent = "0";
        perfectEl.textContent = "0";

        stack.push({ x: (W - BASE_W) / 2, w: BASE_W, y: BASE_Y, hue: colorFor(0) });
        dropY = BASE_Y;
        spawnMoving();
      }

      function spawnMoving() {
        const top = topBlock();
        moving = {
          x: Math.random() < 0.5 ? -10 : W - top.w + 10,
          w: top.w,
          hue: colorFor(stack.length),
        };
        moving.x = Math.max(0, Math.min(W - moving.w, moving.x));
        dir = Math.random() < 0.5 ? -1 : 1;
      }

      function startGame() {
        newGame();
        state = "running";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "Pause";
        hideOverlay();
        ensureAudio();
        if (!rafId) rafId = requestAnimationFrame(loop);
      }

      function setPaused(paused) {
        state = paused ? "paused" : "running";
        pauseBtn.textContent = paused ? "Resume" : "Pause";
        if (paused) {
          eyebrowEl.textContent = "Take a breath";
          overlayTitle.textContent = "Paused";
          overlayMessage.textContent = "Press Resume or P to keep stacking.";
          startBtn.textContent = "Resume";
          newBadge.classList.remove("show");
          overlay.classList.remove("hidden");
        } else {
          hideOverlay();
        }
        draw();
      }

      function togglePause() {
        if (state === "running") setPaused(true);
        else if (state === "paused") setPaused(false);
      }

      function showResultOverlay() {
        eyebrowEl.textContent = "Tower fell";
        overlayTitle.textContent = "Game Over";
        overlayMessage.textContent =
          "You stacked " + score + " blocks" + (perfectStreak > 1 ? " with a " + perfectStreak + " perfect streak!" : "!");
        startBtn.textContent = "Build Again";
        newBadge.classList.toggle("show", newBestThisRun);
        overlay.classList.remove("hidden");
      }

      function endGame() {
        state = "over";
        pauseBtn.disabled = true;
        banner.className = "";
        if (score > best) {
          best = score;
          newBestThisRun = true;
          bestEl.textContent = best;
          localStorage.setItem("rainbow-tower-best", String(best));
        }
        tone(180, 0.35, "sawtooth", 0.06, 0, 60);
        showResultOverlay();
        draw();
      }

      function addToBestIfNeeded() {
        if (score > best) {
          best = score;
          newBestThisRun = true;
          bestEl.textContent = best;
          localStorage.setItem("rainbow-tower-best", String(best));
        }
      }

      // ---------- drop ----------
      function dropBlock() {
        if (state !== "running" || !moving) return;
        const top = topBlock();
        const left = Math.max(moving.x, top.x);
        const right = Math.min(moving.x + moving.w, top.x + top.w);
        const overlap = right - left;

        if (overlap <= 0) {
          // Complete miss: the whole block tumbles away.
          const y = dropY - BLOCK_H;
          debris.push({ x: moving.x, y, w: moving.w, rot: 0, vr: (Math.random() - 0.5) * 0.3, vy: -1, hue: moving.hue });
          tone(160, 0.25, "sawtooth", 0.05, 0, 60);
          burst(moving.x + moving.w / 2, y + BLOCK_H, [moving.hue], 18, 2);
          endGame();
          moving = null;
          return;
        }

        const isPerfect = overlap >= moving.w - PERFECT_TOLERANCE;
        const newW = isPerfect ? moving.w : Math.max(overlap, MIN_W);

        // The slice.
        sliceSound(isPerfect);

        // Offcut pieces fall away when the alignment is imperfect.
        const topY = dropY - BLOCK_H;
        if (!isPerfect) {
          const cutLeft = moving.x - top.x;
          if (cutLeft > 0.5) {
            debris.push({ x: moving.x, y: topY, w: cutLeft, rot: 0, vr: -0.12, vy: -2.5, hue: moving.hue });
          }
          const cutRight = (moving.x + moving.w) - (top.x + top.w);
          if (cutRight > 0.5) {
            debris.push({ x: right, y: topY, w: cutRight, rot: 0, vr: 0.12, vy: -2.5, hue: moving.hue });
          }
          burst(left + overlap / 2, topY + BLOCK_H, [moving.hue, 40], 14, 1.6);
          spawnPopup(moving.x + moving.w / 2, topY - 8, "SLICE", "#fca5a5");
        }

        if (newW < MIN_W) {
          endGame();
          moving = null;
          return;
        }

        stack.push({ x: left, w: newW, y: topY, hue: moving.hue });
        score++;
        scoreEl.textContent = score;

        if (isPerfect) {
          perfectStreak++;
          perfectEl.textContent = perfectStreak;
          flashTimer = 14;
          ring(moving.x + moving.w / 2, topY, moving.hue);
          burst(moving.x + moving.w / 2, topY + BLOCK_H / 2, [moving.hue, 45, 190], 22, 2.2);
          spawnPopup(moving.x + moving.w / 2, topY - 10, "PERFECT!", "#fde68a");
          showBanner(perfectStreak > 1 ? "PERFECT x" + perfectStreak : "PERFECT SLICE", "good", 95);
          if (perfectStreak >= 2) {
            comboEl.textContent = "PERFECT x" + perfectStreak;
            comboEl.classList.remove("hidden", "bump");
            void comboEl.offsetWidth;
            comboEl.classList.add("bump");
          }
        } else {
          perfectStreak = 0;
          perfectEl.textContent = "0";
          comboEl.classList.add("hidden");
        }

        addToBestIfNeeded();

        // Camera: keep the tower on screen as it grows.
        dropY = topY;
        if (dropY < 160) {
          const shift = 130;
          stack.forEach((b) => (b.y += shift));
          dropY += shift;
          debris.forEach((d) => (d.y += shift));
        }

        moving = null;
        spawnMoving();
      }

      // ---------- update / draw ----------
      function update() {
        if (moving && state === "running") {
          moving.x += dir * currentSpeed();
          if (moving.x <= 0) {
            moving.x = 0;
            dir = 1;
          } else if (moving.x + moving.w >= W) {
            moving.x = W - moving.w;
            dir = -1;
          }
        }

        if (flashTimer > 0) flashTimer--;
        if (bannerTimer > 0 && --bannerTimer === 0) banner.className = "";

        for (let i = debris.length - 1; i >= 0; i--) {
          const d = debris[i];
          d.vy += 0.42;
          d.x += (d.vr || 0) * 12;
          d.y += d.vy;
          d.rot += d.vr || 0.1;
          if (d.y > H + 40) debris.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.life -= 0.035;
          if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = rings.length - 1; i >= 0; i--) {
          const rg = rings[i];
          rg.r += 3.2;
          rg.life -= 0.05;
          if (rg.life <= 0) rings.splice(i, 1);
        }
      }

      function loop() {
        const fxRunning = state === "over" && (debris.length > 0 || particles.length > 0);
        if (state === "running" || fxRunning) update();
        draw();
        if (state === "running" || state === "paused" || fxRunning) {
          rafId = requestAnimationFrame(loop);
        } else {
          rafId = null;
        }
      }

      function drawBlock(b, flash) {
        const g = ctx.createLinearGradient(0, b.y, 0, b.y + BLOCK_H);
        g.addColorStop(0, "hsl(" + Math.round(b.hue) + ", 88%, 68%)");
        g.addColorStop(1, "hsl(" + Math.round(b.hue) + ", 88%, 48%)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, BLOCK_H, 4);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 4);
        if (flash) {
          ctx.fillStyle = "rgba(255,255,255," + (flashTimer / 14) * 0.5 + ")";
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, BLOCK_H, 4);
          ctx.fill();
        }
      }

      function draw() {
        // Sky
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#111634");
        sky.addColorStop(0.55, "#0b0e1f");
        sky.addColorStop(1, "#05060f");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        // Soft glow behind tower
        const top = topBlock();
        const glowY = Math.min(top.y, dropY - BLOCK_H);
        const gg = ctx.createRadialGradient(W / 2, glowY, 10, W / 2, glowY, 260);
        gg.addColorStop(0, "rgba(139, 92, 246, 0.14)");
        gg.addColorStop(1, "rgba(139, 92, 246, 0)");
        ctx.fillStyle = gg;
        ctx.fillRect(0, 0, W, H);

        // Ground line
        ctx.fillStyle = "rgba(148, 163, 184, 0.25)";
        ctx.fillRect(0, BASE_Y + BLOCK_H + 4, W, 3);

        // Stack
        stack.forEach((b, i) => {
          const flash = i === stack.length - 1 && flashTimer > 0;
          drawBlock(b, flash);
        });

        // Falling offcuts
        debris.forEach((d) => {
          ctx.save();
          ctx.translate(d.x + d.w / 2, d.y + BLOCK_H / 2);
          ctx.rotate(d.rot);
          ctx.translate(-(d.x + d.w / 2), -(d.y + BLOCK_H / 2));
          drawBlock(d);
          ctx.restore();
        });

        // Alignment guides
        if (moving && state === "running") {
          ctx.save();
          ctx.strokeStyle = "rgba(148, 163, 184, 0.22)";
          ctx.setLineDash([4, 6]);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(moving.x + 1, dropY - BLOCK_H - 70);
          ctx.lineTo(moving.x + 1, top.y);
          ctx.moveTo(moving.x + moving.w - 1, dropY - BLOCK_H - 70);
          ctx.lineTo(moving.x + moving.w - 1, top.y);
          ctx.stroke();
          ctx.restore();
        }

        // Moving block
        if (moving && (state === "running" || state === "paused")) {
          const shadowY = dropY - BLOCK_H + 4;
          ctx.fillStyle = "rgba(0,0,0,0.3)";
          ctx.beginPath();
          ctx.roundRect(moving.x, shadowY, moving.w, BLOCK_H, 4);
          ctx.fill();

          ctx.save();
          ctx.shadowColor = "hsl(" + Math.round(moving.hue) + ", 90%, 65%)";
          ctx.shadowBlur = 18;
          const g = ctx.createLinearGradient(0, dropY - BLOCK_H, 0, dropY);
          g.addColorStop(0, "hsl(" + Math.round(moving.hue) + ", 92%, 72%)");
          g.addColorStop(1, "hsl(" + Math.round(moving.hue) + ", 90%, 54%)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.roundRect(moving.x, dropY - BLOCK_H, moving.w, BLOCK_H, 4);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.35)";
          ctx.fillRect(moving.x + 3, dropY - BLOCK_H + 2, moving.w - 6, 4);
          ctx.restore();
        }

        // Sparkles
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        particles.forEach((p) => {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = "hsl(" + Math.round(p.hue) + ", 95%, 65%)";
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.8, p.size * p.life), 0, Math.PI * 2);
          ctx.fill();
        });
        rings.forEach((rg) => {
          ctx.globalAlpha = Math.max(0, rg.life);
          ctx.strokeStyle = "hsl(" + Math.round(rg.hue) + ", 95%, 70%)";
          ctx.lineWidth = 3 * rg.life + 1;
          ctx.beginPath();
          ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
          ctx.stroke();
        });
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      // ---------- overlays / input ----------
      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function showStartOverlay() {
        eyebrowEl.textContent = "Slice & Stack";
        overlayTitle.textContent = "Rainbow Tower";
        overlayMessage.textContent =
          "Time your drop so each block lands perfectly on the tower. Overhang gets sliced away - slice it perfectly to keep the full block!";
        startBtn.textContent = "Start Building";
        newBadge.classList.remove("show");
        overlay.classList.remove("hidden");
      }

      function tryDrop() {
        ensureAudio();
        if (state === "start" || state === "over") {
          startGame();
        } else {
          dropBlock();
        }
      }

      document.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (key === "p") {
          e.preventDefault();
          togglePause();
          return;
        }
        if (key === "r") {
          e.preventDefault();
          startGame();
          return;
        }
        if (key === "m") {
          e.preventDefault();
          muted = !muted;
          muteBtn.textContent = muted ? "🔇" : "🔊";
          return;
        }
        if (key === " " || key === "arrowdown" || key === "enter") {
          e.preventDefault();
          tryDrop();
        }
      });

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        tryDrop();
      });

      startBtn.addEventListener("click", () => {
        ensureAudio();
        if (state === "paused") setPaused(false);
        else startGame();
      });
      pauseBtn.addEventListener("click", togglePause);
      muteBtn.addEventListener("click", () => {
        muted = !muted;
        muteBtn.textContent = muted ? "🔇" : "🔊";
      });

      showStartOverlay();
      newGame();
      draw();
    })();
  </script>
</body>
</html>
