<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainbow Blocks</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --accent: #4ade80;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .game {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      max-width: 560px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .title {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .scores {
      display: flex;
      gap: 0.75rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .scores strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .board-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #0b1220;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      background: rgba(11, 18, 32, 0.82);
      text-align: center;
      padding: 1.5rem;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.5rem;
    }

    .overlay p {
      color: var(--muted);
      max-width: 34ch;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1rem;
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    button {
      background: var(--accent);
      color: #052e16;
      border: none;
      border-radius: 10px;
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    button:hover {
      background: #6ee7a0;
    }

    button:active {
      transform: scale(0.97);
    }

    .muted-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }

    .muted-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    @media (max-width: 480px) {
      .scores {
        flex-direction: column;
        gap: 0.15rem;
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="header">
      <div class="title">Rainbow Blocks</div>
      <div class="scores">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
      </div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="480" height="640"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Rainbow Blocks</h2>
        <p id="overlay-message">Break all the rainbow bricks with the ball. Don't let it fall!</p>
        <button id="start-btn">Start Game</button>
      </div>
    </div>

    <div class="controls">
      <p class="hint">
        <strong>Mouse</strong> or <strong>arrow keys</strong> to move<br />
        <strong>P</strong> to pause - <strong>R</strong> to restart
      </p>
      <button id="pause-btn" class="muted-btn" disabled>Pause</button>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;

      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMessage = document.getElementById("overlay-message");
      const startBtn = document.getElementById("start-btn");
      const pauseBtn = document.getElementById("pause-btn");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const livesEl = document.getElementById("lives");

      const PADDLE_W = 90;
      const PADDLE_H = 12;
      const PADDLE_Y = H - 30;
      const BALL_R = 6;
      const BALL_SPEED = 3.4;
      const ROWS = 5;
      const COLS = 8;
      const BRICK_W = 54;
      const BRICK_H = 20;
      const BRICK_GAP = 4;
      const BRICK_TOP = 60;
      const BRICK_LEFT = 8;
      const MAX_LIVES = 3;

      let bricks = [];
      let ball = null;
      let ballDx = BALL_SPEED;
      let ballDy = -BALL_SPEED;
      let paddleX = W / 2 - PADDLE_W / 2;
      let score = 0;
      let lives = MAX_LIVES;
      let best = Number(localStorage.getItem("rainbow-blocks-best") || 0);
      let state = "start"; // start | running | paused | over | won
      let rafId = null;

      bestEl.textContent = best;

      function buildBricks() {
        bricks = [];
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const hue = ((row * COLS + col) * 360) / (ROWS * COLS);
            bricks.push({
              x: BRICK_LEFT + col * (BRICK_W + BRICK_GAP),
              y: BRICK_TOP + row * (BRICK_H + BRICK_GAP),
              w: BRICK_W,
              h: BRICK_H,
              hue,
            });
          }
        }
      }

      function resetBall() {
        ball = { x: paddleX + PADDLE_W / 2, y: PADDLE_Y - BALL_R };
        ballDx = BALL_SPEED * (Math.random() < 0.5 ? -1 : 1);
        ballDy = -BALL_SPEED;
      }

      function newGame() {
        score = 0;
        lives = MAX_LIVES;
        paddleX = W / 2 - PADDLE_W / 2;
        scoreEl.textContent = "0";
        livesEl.textContent = lives;
        buildBricks();
        resetBall();
        draw();
      }

      function startGame() {
        newGame();
        state = "running";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "Pause";
        overlay.classList.add("hidden");
        if (!rafId) rafId = requestAnimationFrame(loop);
      }

      function togglePause() {
        if (state === "running") {
          state = "paused";
          pauseBtn.textContent = "Resume";
        } else if (state === "paused") {
          state = "running";
          pauseBtn.textContent = "Pause";
        }
        draw();
      }

      function endGame(won) {
        state = won ? "won" : "over";
        pauseBtn.disabled = true;
        overlayTitle.textContent = won ? "You win!" : "Game Over";
        overlayMessage.textContent = won
          ? "You cleared every brick!"
          : "Final score " + score + ". Don't let the ball fall!";
        startBtn.textContent = "Play Again";
        overlay.classList.remove("hidden");
        saveBest();
        draw();
      }

      function saveBest() {
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem("rainbow-blocks-best", String(best));
        }
      }

      function update() {
        ball.x += ballDx;
        ball.y += ballDy;

        if (ball.x - BALL_R <= 0 || ball.x + BALL_R >= W) ballDx = -ballDx;
        if (ball.y - BALL_R <= 0) ballDy = -ballDy;

        if (ballDy > 0 && ball.y + BALL_R >= PADDLE_Y && ball.y + BALL_R <= PADDLE_Y + PADDLE_H + 4 && ball.x >= paddleX && ball.x <= paddleX + PADDLE_W) {
          const offset = (ball.x - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2);
          ballDx = offset * BALL_SPEED * 1.4;
          ballDy = -Math.abs(ballDy);
        }

        for (let i = bricks.length - 1; i >= 0; i--) {
          const b = bricks[i];
          if (ball.x + BALL_R >= b.x && ball.x - BALL_R <= b.x + b.w && ball.y + BALL_R >= b.y && ball.y - BALL_R <= b.y + b.h) {
            bricks.splice(i, 1);
            ballDy = -ballDy;
            score += 10;
            scoreEl.textContent = score;
          }
        }

        if (ball.y - BALL_R > H) {
          lives--;
          livesEl.textContent = lives;
          if (lives <= 0) {
            endGame(false);
          } else {
            resetBall();
          }
        } else if (bricks.length === 0) {
          endGame(true);
        }
      }

      function loop() {
        if (state === "running") update();
        draw();
        if (state !== "start" && state !== "over" && state !== "won") {
          rafId = requestAnimationFrame(loop);
        } else {
          rafId = null;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (let y = 0; y < H; y += 16) {
          for (let x = 0; x < W; x += 16) {
            ctx.fillStyle = (x / 16 + y / 16) % 2 === 0 ? "#0e1729" : "#0b1220";
            ctx.fillRect(x, y, 16, 16);
          }
        }

        bricks.forEach((b) => {
          ctx.fillStyle = "hsl(" + Math.round(b.hue) + ", 90%, 55%)";
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 6);
          ctx.fill();
        });

        ctx.fillStyle = "#94a3b8";
        ctx.beginPath();
        ctx.roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
        ctx.fill();

        if (ball) {
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
          ctx.fillStyle = "#f8fafc";
          ctx.fill();
        }

        if (state === "paused") {
          ctx.fillStyle = "rgba(11, 18, 32, 0.55)";
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "bold 44px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("Paused", W / 2, H / 2);
        }
      }

      function movePaddle(x) {
        paddleX = Math.max(0, Math.min(W - PADDLE_W, x - PADDLE_W / 2));
      }

      // input
      document.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (key === "p") {
          e.preventDefault();
          togglePause();
          return;
        }
        if (key === "r") {
          e.preventDefault();
          startGame();
          return;
        }
        if (key === "arrowleft" || key === "a") {
          e.preventDefault();
          if (state === "start" || state === "over" || state === "won") startGame();
          paddleX = Math.max(0, paddleX - 14);
          return;
        }
        if (key === "arrowright" || key === "d") {
          e.preventDefault();
          if (state === "start" || state === "over" || state === "won") startGame();
          paddleX = Math.min(W - PADDLE_W, paddleX + 14);
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        movePaddle(((e.clientX - rect.left) / rect.width) * W);
      });
      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        movePaddle(((e.touches[0].clientX - rect.left) / rect.width) * W);
      }, { passive: false });

      startBtn.addEventListener("click", startGame);
      pauseBtn.addEventListener("click", togglePause);

      newGame();
      draw();
    })();
  </script>
</body>
</html>
