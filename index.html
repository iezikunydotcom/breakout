<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>" />
  <title>Rainbow Blocks</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(20, 29, 48, 0.82);
      --border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1000px 600px at 15% -10%, rgba(167, 139, 250, 0.16), transparent 60%),
        radial-gradient(900px 600px at 110% 110%, rgba(74, 222, 128, 0.12), transparent 60%),
        radial-gradient(700px 500px at 85% -5%, rgba(56, 189, 248, 0.1), transparent 55%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .shell {
      width: 100%;
      max-width: 520px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.9rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .grad {
      background: linear-gradient(90deg, #f87171, #fbbf24, #4ade80, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .pills {
      display: flex;
      gap: 0.4rem;
    }

    .pill {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 0.38rem 0.6rem;
      min-width: 58px;
    }

    .pill .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .pill strong {
      font-size: 1.02rem;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 0.85rem;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .board-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #070b16;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.08), 0 0 34px rgba(74, 222, 128, 0.06);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 11, 22, 0.8);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.22s ease-out;
      padding: 1.25rem;
      z-index: 4;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-inner {
      text-align: center;
      max-width: 34ch;
      animation: riseIn 0.28s ease-out;
    }

    .overlay .eyebrow {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--muted);
      margin-bottom: 0.45rem;
      font-weight: 700;
    }

    .overlay h2 {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 0.55rem;
    }

    .overlay p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .badge-new {
      display: none;
      margin: 0 auto 0.7rem;
      width: fit-content;
      background: linear-gradient(90deg, #fbbf24, #f87171);
      color: #1f1205;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.35);
    }

    .badge-new.show {
      display: block;
      animation: pop 0.3s ease-out;
    }

    .btn {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      font-family: inherit;
      transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      color: #052016;
      font-size: 1.02rem;
      padding: 0.8rem 2rem;
      box-shadow: 0 8px 26px rgba(74, 222, 128, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(74, 222, 128, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      font-size: 0.9rem;
    }

    .btn-ghost:hover {
      color: var(--text);
      background: rgba(148, 163, 184, 0.1);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.7rem;
    }

    .progress {
      flex: 1;
      height: 8px;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4ade80, #22d3ee, #a78bfa);
      transition: width 0.25s ease;
    }

    .combo {
      font-weight: 900;
      font-size: 0.9rem;
      padding: 0.15rem 0.7rem;
      border-radius: 999px;
      color: #1f1205;
      background: linear-gradient(90deg, #fbbf24, #f87171);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.35);
    }

    .combo.hidden {
      display: none;
    }

    .combo.bump {
      animation: pop 0.25s ease-out;
    }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .foot-btns {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .kbd {
      display: inline-block;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 0.02rem 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }

    .popup {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: 0.95rem;
      color: #f8fafc;
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 3;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%); }
      100% { opacity: 0; transform: translate(-50%, -180%); }
    }

    @media (max-width: 440px) {
      .top { justify-content: center; }
      .brand { width: 100%; text-align: center; }
      .foot { justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <h1 class="brand"><span class="grad">Rainbow Blocks</span></h1>
      <div class="pills">
        <div class="pill"><span class="label">Score</span><strong id="score">0</strong></div>
        <div class="pill"><span class="label">Best</span><strong id="best">0</strong></div>
        <div class="pill"><span class="label">Level</span><strong id="level">1</strong></div>
        <div class="pill"><span class="label">Lives</span><strong id="lives">3</strong></div>
      </div>
    </header>

    <section class="stage">
      <div id="board-wrap" class="board-wrap">
        <canvas id="board" width="480" height="640"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-inner">
            <div id="eyebrow" class="eyebrow">Arcade Classic</div>
            <h2 id="overlay-title" class="grad">Rainbow Blocks</h2>
            <p id="overlay-message">Guide the ball and smash every rainbow brick. Catch falling power-ups and chain quick hits for combos!</p>
            <div id="new-badge" class="badge-new">New Best!</div>
            <button id="start-btn" class="btn btn-primary">Start Game</button>
          </div>
        </div>
      </div>

      <div class="status">
        <div class="progress"><div id="progress-fill"></div></div>
        <span id="combo" class="combo hidden">x2</span>
      </div>

      <div class="foot">
        <p class="hint">
          <span class="kbd">Mouse</span> / <span class="kbd">←</span> <span class="kbd">→</span> to move<br />
          <span class="kbd">P</span> pause &middot; <span class="kbd">R</span> restart &middot; <span class="kbd">M</span> sound
        </p>
        <div class="foot-btns">
          <button id="mute-btn" class="btn btn-ghost" aria-label="Toggle sound">🔊</button>
          <button id="pause-btn" class="btn btn-ghost" disabled>Pause</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const boardWrap = document.getElementById("board-wrap");
      const W = canvas.width;
      const H = canvas.height;

      const overlay = document.getElementById("overlay");
      const eyebrowEl = document.getElementById("eyebrow");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMessage = document.getElementById("overlay-message");
      const newBadge = document.getElementById("new-badge");
      const startBtn = document.getElementById("start-btn");
      const pauseBtn = document.getElementById("pause-btn");
      const muteBtn = document.getElementById("mute-btn");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const levelEl = document.getElementById("level");
      const livesEl = document.getElementById("lives");
      const comboEl = document.getElementById("combo");
      const progressFill = document.getElementById("progress-fill");

      const BASE_SPEED = 3.4;
      const PADDLE_H = 12;
      const PADDLE_Y = H - 30;
      const PADDLE_NORMAL = 90;
      const PADDLE_WIDE = 150;
      const BALL_R = 6;
      const COLS = 8;
      const BRICK_W = 54;
      const BRICK_H = 20;
      const BRICK_GAP = 4;
      const BRICK_TOP = 60;
      const BRICK_LEFT = 8;
      const MAX_LIVES = 5;
      const START_LIVES = 3;

      let bricks = [];
      let totalBricks = 0;
      let ball = null;
      let ballDx = BASE_SPEED;
      let ballDy = -BASE_SPEED;
      let paddleX = W / 2 - PADDLE_NORMAL / 2;
      let paddleW = PADDLE_NORMAL;
      let score = 0;
      let best = Number(localStorage.getItem("rainbow-blocks-best") || 0);
      let lives = START_LIVES;
      let level = 1;
      let state = "start";
      let newBestThisRun = false;
      let rafId = null;

      let particles = [];
      let powerups = [];
      let trail = [];
      let wideTimer = 0;
      let slowTimer = 0;
      let streak = 0;
      let comboMult = 1;
      let lastHitAt = 0;

      // Tiny Web Audio synth - no audio files needed.
      let audioCtx = null;
      let muted = false;

      function ensureAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            audioCtx = null;
          }
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }

      function tone(freq, duration, type, volume, delay) {
        if (muted || !audioCtx) return;
        try {
          const t = audioCtx.currentTime + (delay || 0);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || "square";
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(volume || 0.04, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + (duration || 0.1));
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + (duration || 0.1) + 0.02);
        } catch (e) {
          // ignore audio errors
        }
      }

      const sfx = {
        brick: () => tone(640, 0.07, "square", 0.045),
        paddle: () => tone(320, 0.06, "triangle", 0.05),
        power: () => { tone(660, 0.09, "sine", 0.06); tone(990, 0.12, "sine", 0.05, 0.08); },
        life: () => { tone(520, 0.1, "sine", 0.06); tone(780, 0.14, "sine", 0.06, 0.1); },
        lose: () => tone(220, 0.25, "sawtooth", 0.05),
        win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, "sine", 0.06, i * 0.1)); },
      };

      function rowsForLevel(lvl) {
        return Math.min(8, 4 + lvl);
      }

      function speedForLevel(lvl) {
        return BASE_SPEED * Math.min(1.6, 1 + (lvl - 1) * 0.09);
      }

      function buildBricks() {
        bricks = [];
        const rows = rowsForLevel(level);
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < COLS; col++) {
            const hue = ((row * COLS + col) * 360) / (rows * COLS);
            bricks.push({
              x: BRICK_LEFT + col * (BRICK_W + BRICK_GAP),
              y: BRICK_TOP + row * (BRICK_H + BRICK_GAP),
              w: BRICK_W,
              h: BRICK_H,
              hue,
            });
          }
        }
        totalBricks = bricks.length;
        updateProgress();
      }

      function updateProgress() {
        const pct = totalBricks ? Math.round((bricks.length / totalBricks) * 100) : 0;
        progressFill.style.width = pct + "%";
      }

      function resetBall() {
        ball = { x: paddleX + paddleW / 2, y: PADDLE_Y - BALL_R };
        const s = speedForLevel(level) * (slowTimer > 0 ? 0.72 : 1);
        ballDx = s * (Math.random() < 0.5 ? -1 : 1);
        ballDy = -s;
      }

      function showOverlay(eyebrow, title, message, button, showBadge) {
        eyebrowEl.textContent = eyebrow;
        overlayTitle.textContent = title;
        overlayMessage.textContent = message;
        startBtn.textContent = button;
        newBadge.classList.toggle("show", Boolean(showBadge));
        overlay.classList.remove("hidden");
      }

      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function renderOverlay() {
        if (state === "start") {
          showOverlay(
            "Arcade Classic",
            "Rainbow Blocks",
            "Smash bricks, catch falling power-ups, and chain quick hits for combo multipliers. Don't let the ball drop!",
            "Start Game",
            false
          );
        } else if (state === "paused") {
          showOverlay("Take a breath", "Paused", "Press Resume or P to keep playing.", "Resume", false);
        } else if (state === "over") {
          showOverlay(
            "Nice try",
            "Game Over",
            "You reached level " + level + " with " + score + " points!",
            "Play Again",
            newBestThisRun
          );
        } else if (state === "won") {
          showOverlay(
            "Level " + level + " cleared",
            "Next Level!",
            "Score " + score + " - bricks get tougher every level.",
            "Next Level",
            newBestThisRun
          );
        }
      }

      function newGame() {
        score = 0;
        level = 1;
        lives = START_LIVES;
        newBestThisRun = false;
        scoreEl.textContent = "0";
        levelEl.textContent = level;
        livesEl.textContent = lives;
        paddleX = W / 2 - PADDLE_NORMAL / 2;
        paddleW = PADDLE_NORMAL;
        wideTimer = 0;
        slowTimer = 0;
        streak = 0;
        comboMult = 1;
        comboEl.classList.add("hidden");
        particles = [];
        powerups = [];
        trail = [];
        buildBricks();
        resetBall();
      }

      function startGame() {
        newGame();
        state = "running";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "Pause";
        hideOverlay();
        ensureAudio();
        if (!rafId) rafId = requestAnimationFrame(loop);
      }

      function nextLevel() {
        level++;
        levelEl.textContent = level;
        streak = 0;
        comboMult = 1;
        comboEl.classList.add("hidden");
        particles = [];
        powerups = [];
        trail = [];
        paddleX = W / 2 - paddleW / 2;
        buildBricks();
        resetBall();
        state = "running";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "Pause";
        hideOverlay();
        if (!rafId) rafId = requestAnimationFrame(loop);
      }

      function setPaused(paused) {
        state = paused ? "paused" : "running";
        pauseBtn.textContent = paused ? "Resume" : "Pause";
        if (paused) renderOverlay();
        else hideOverlay();
        draw();
      }

      function togglePause() {
        if (state === "running") setPaused(true);
        else if (state === "paused") setPaused(false);
      }

      function endGame() {
        state = "over";
        pauseBtn.disabled = true;
        sfx.lose();
        renderOverlay();
        draw();
      }

      function addScore(points) {
        score += points;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          newBestThisRun = true;
          bestEl.textContent = best;
          localStorage.setItem("rainbow-blocks-best", String(best));
        }
      }

      function spawnPopup(px, py, text) {
        const scale = boardWrap.clientWidth / W;
        const el = document.createElement("span");
        el.className = "popup";
        el.textContent = text;
        el.style.left = px * scale + "px";
        el.style.top = py * scale + "px";
        boardWrap.appendChild(el);
        setTimeout(() => el.remove(), 850);
      }

      function burst(x, y, hue, count) {
        for (let i = 0; i < (count || 8); i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 3.2;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            hue: hue + (Math.random() * 30 - 15),
          });
        }
      }

      function updateCombo() {
        const now = performance.now();
        if (now - lastHitAt > 1200 && comboMult > 1) {
          streak = 0;
          comboMult = 1;
          comboEl.classList.add("hidden");
        }
      }

      function refreshComboChip() {
        if (comboMult > 1) {
          comboEl.textContent = "x" + comboMult;
          comboEl.classList.remove("hidden", "bump");
          void comboEl.offsetWidth;
          comboEl.classList.add("bump");
        } else {
          comboEl.classList.add("hidden");
        }
      }

      function spawnPowerup(x, y) {
        if (Math.random() > 0.17) return;
        const r = Math.random();
        const type = r < 0.42 ? "wide" : r < 0.67 ? "life" : "slow";
        powerups.push({ x, y, type, vy: 2.5 });
      }

      function applyPowerup(type) {
        if (type === "wide") {
          wideTimer = 600;
          paddleW = PADDLE_WIDE;
          paddleX = Math.max(0, Math.min(W - paddleW, paddleX + (PADDLE_NORMAL - paddleW) / 2));
          sfx.power();
        } else if (type === "slow") {
          slowTimer = 480;
          resetBall();
          sfx.power();
        } else if (type === "life") {
          if (lives < MAX_LIVES) {
            lives++;
            livesEl.textContent = lives;
          }
          sfx.life();
        }
      }

      function powerupGlyph(type) {
        if (type === "wide") return "⬌";
        if (type === "slow") return "❄";
        return "♥";
      }

      function powerupColor(type) {
        if (type === "wide") return "#22d3ee";
        if (type === "slow") return "#93c5fd";
        return "#fb7185";
      }

      function update() {
        const eff = slowTimer > 0 ? 0.72 : 1;
        ball.x += ballDx;
        ball.y += ballDy;

        if (wideTimer > 0) wideTimer--;
        if (slowTimer > 0) slowTimer--;
        if (wideTimer === 0 && paddleW !== PADDLE_NORMAL) {
          const center = paddleX + paddleW / 2;
          paddleW = PADDLE_NORMAL;
          paddleX = Math.max(0, Math.min(W - paddleW, center - paddleW / 2));
        }

        trail.unshift({ x: ball.x, y: ball.y });
        if (trail.length > 11) trail.pop();

        if (ball.x - BALL_R <= 0 || ball.x + BALL_R >= W) {
          ballDx = -ballDx;
          tone(500, 0.05, "triangle", 0.03);
        }
        if (ball.y - BALL_R <= 0) ballDy = -ballDy;

        const padRect = { x: paddleX, y: PADDLE_Y, w: paddleW, h: PADDLE_H };
        if (
          ballDy > 0 &&
          ball.y + BALL_R >= padRect.y &&
          ball.y + BALL_R <= padRect.y + padRect.h + 4 &&
          ball.x >= padRect.x &&
          ball.x <= padRect.x + padRect.w
        ) {
          const offset = (ball.x - (padRect.x + padRect.w / 2)) / (padRect.w / 2);
          const s = speedForLevel(level) * eff;
          ballDx = offset * s * 1.35;
          ballDy = -Math.abs(s);
          sfx.paddle();
        }

        for (let i = bricks.length - 1; i >= 0; i--) {
          const b = bricks[i];
          if (
            ball.x + BALL_R >= b.x && ball.x - BALL_R <= b.x + b.w &&
            ball.y + BALL_R >= b.y && ball.y - BALL_R <= b.y + b.h
          ) {
            bricks.splice(i, 1);
            ballDy = -Math.abs(ballDy);

            const now = performance.now();
            streak = now - lastHitAt < 1100 ? streak + 1 : 1;
            lastHitAt = now;
            comboMult = Math.min(6, 1 + Math.floor(streak / 4));
            const points = 10 * comboMult;
            addScore(points);
            updateProgress();
            burst(b.x + b.w / 2, b.y + b.h / 2, b.hue);
            spawnPopup(b.x + b.w / 2, b.y + b.h / 2, "+" + points + (comboMult > 1 ? " x" + comboMult : ""));
            spawnPowerup(b.x + b.w / 2, b.y + b.h / 2);
            sfx.brick();
            refreshComboChip();
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.14;
          p.life -= 0.045;
          if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = powerups.length - 1; i >= 0; i--) {
          const pu = powerups[i];
          pu.y += pu.vy;
          const caught =
            pu.y + 8 >= padRect.y && pu.y - 8 <= padRect.y + padRect.h &&
            pu.x >= padRect.x && pu.x <= padRect.x + padRect.w;
          if (caught) {
            applyPowerup(pu.type);
            powerups.splice(i, 1);
          } else if (pu.y > H + 10) {
            powerups.splice(i, 1);
          }
        }

        updateCombo();

        if (ball.y - BALL_R > H) {
          lives--;
          livesEl.textContent = lives;
          trail = [];
          if (lives <= 0) {
            endGame();
          } else {
            tone(200, 0.2, "sawtooth", 0.04);
            resetBall();
          }
        } else if (bricks.length === 0) {
          state = "won";
          pauseBtn.disabled = true;
          sfx.win();
          renderOverlay();
          draw();
        }
      }

      function loop() {
        if (state === "running") update();
        draw();
        if (state !== "start" && state !== "over" && state !== "won") {
          rafId = requestAnimationFrame(loop);
        } else {
          rafId = null;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (let y = 0; y < H; y += 16) {
          for (let x = 0; x < W; x += 16) {
            ctx.fillStyle = (x / 16 + y / 16) % 2 === 0 ? "#0d1424" : "#0a101d";
            ctx.fillRect(x, y, 16, 16);
          }
        }

        bricks.forEach((b) => {
          ctx.fillStyle = "hsl(" + Math.round(b.hue) + ", 85%, 56%)";
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 6);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.18)";
          ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 4);
        });

        for (let i = 0; i < trail.length; i++) {
          const t = trail[i];
          const a = ((trail.length - i) / trail.length) * 0.16;
          ctx.beginPath();
          ctx.arc(t.x, t.y, BALL_R * (1 - (i / trail.length) * 0.55), 0, Math.PI * 2);
          ctx.fillStyle = "rgba(248, 250, 252, " + a.toFixed(3) + ")";
          ctx.fill();
        }

        powerups.forEach((pu) => {
          const wob = Math.sin(performance.now() / 160 + pu.x) * 2;
          ctx.beginPath();
          ctx.arc(pu.x, pu.y + wob, 9, 0, Math.PI * 2);
          ctx.fillStyle = powerupColor(pu.type);
          ctx.shadowColor = powerupColor(pu.type);
          ctx.shadowBlur = 14;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#0b1020";
          ctx.font = "bold 11px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(powerupGlyph(pu.type), pu.x, pu.y + wob);
        });

        particles.forEach((p) => {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = "hsl(" + Math.round(p.hue) + ", 90%, 60%)";
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.6 * p.life + 0.5, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.shadowColor = wideTimer > 0 ? "rgba(34,211,238,0.9)" : "rgba(148,163,184,0.75)";
        ctx.shadowBlur = 16;
        ctx.fillStyle = slowTimer > 0 ? "#a5c8ff" : "#cbd5e1";
        ctx.beginPath();
        ctx.roundRect(paddleX, PADDLE_Y, paddleW, PADDLE_H, 7);
        ctx.fill();
        ctx.restore();

        if (ball) {
          ctx.save();
          ctx.shadowColor = "rgba(248, 250, 252, 0.9)";
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
          ctx.fillStyle = "#f8fafc";
          ctx.fill();
          ctx.restore();
        }
      }

      function movePaddle(x) {
        paddleX = Math.max(0, Math.min(W - paddleW, x - paddleW / 2));
      }

      document.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (key === "p") {
          e.preventDefault();
          togglePause();
          return;
        }
        if (key === "r") {
          e.preventDefault();
          startGame();
          return;
        }
        if (key === "m") {
          e.preventDefault();
          muted = !muted;
          muteBtn.textContent = muted ? "🔇" : "🔊";
          return;
        }
        if (key === "arrowleft" || key === "a") {
          e.preventDefault();
          ensureAudio();
          if (state === "start" || state === "over") startGame();
          movePaddle(paddleX - 14 + paddleW / 2);
          return;
        }
        if (key === "arrowright" || key === "d") {
          e.preventDefault();
          ensureAudio();
          if (state === "start" || state === "over") startGame();
          movePaddle(paddleX + 14 + paddleW / 2);
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        ensureAudio();
        const rect = canvas.getBoundingClientRect();
        movePaddle(((e.clientX - rect.left) / rect.width) * W);
      });
      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        ensureAudio();
        const rect = canvas.getBoundingClientRect();
        movePaddle(((e.touches[0].clientX - rect.left) / rect.width) * W);
      }, { passive: false });

      startBtn.addEventListener("click", () => {
        ensureAudio();
        if (state === "paused") setPaused(false);
        else if (state === "won") nextLevel();
        else startGame();
      });
      pauseBtn.addEventListener("click", togglePause);
      muteBtn.addEventListener("click", () => {
        muted = !muted;
        muteBtn.textContent = muted ? "🔇" : "🔊";
      });

      renderOverlay();
      newGame();
      draw();
    })();
  </script>
</body>
</html>
